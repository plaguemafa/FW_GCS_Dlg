<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <style>/*Canves元素底层定义*/
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
        }
        #map {
            position: relative;
            cursor: default;
        }
        .tile {
            position: absolute;
            width: 256px;
            height: 256px;
            pointer-events: none;
        }
        #hud {
            position: absolute;
            right: 6px;             /*right: 12px;*/
            top: 0.5%;              /*  在1920x1080分辨率下HUD顶端与窗口顶端留出x.x%像素 */
            width: 360px;
            height: 360px;
            pointer-events: none;
            z-index: 20;
            background: rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
        }
        #status {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #e0e0e0;
            /* color: #0d366d; */
            font-family: Segoe UI, Arial;
            font-size: 12px;
            background: rgba(0,0,0,0.45);
            padding: 6px 8px;
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
        }

        /* FCS 状态历史日志：显示在 #status 下方左对齐 */
        #fcsStatusLog {
            position: absolute;
            left: 12px;
            top: 44px;
            color: #e0e0e0;
            font-family: Segoe UI, Arial;
            font-size: 12px;
            background: rgba(0,0,0,0.35);
            padding: 4px 8px;
            border-radius: 4px;
            z-index: 10;
            pointer-events: auto; /* 允许滚动条鼠标拖动 */
            white-space: pre;
            line-height: 16px;
            /* 10 行：16px * 10 = 160px。允许少量边距误差仍能看到约 10 行。 */
            max-height: 160px;
            overflow-y: auto; /* 超出后滚动 */
            overflow-x: hidden;
            /* 尽量让滚动条更容易拖动（仅影响 WebKit/Chromium） */
            scrollbar-width: thin; /* Firefox */
        }

        #fcsStatusLog::-webkit-scrollbar {
            width: 8px;
        }
        #fcsStatusLog::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 4px;
        }
        #fcsStatusLog::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.05);
        }
        /* 鼠标位置经纬度提示：两行并列 lon / lat，纯白字 */
        #mouseCoordTip {
            position: fixed;
            left: 0;
            top: 0;
            padding: 0;
            font-family: Consolas, monospace;
            font-size: 10px;
            color: #000000;
            background: none;
            border: none;
            white-space: pre;
            pointer-events: none;
            z-index: 30;
            visibility: hidden;
        }
        /* 添加HUD组2和HUD组3的Canvas样式，右对齐 */
        #hudGroup2 {
            position: absolute;
            right: 6px;
            top: 372px;
            width: 360px;
            height: 360px;
            pointer-events: none;
            z-index: 20;
        }
        #hudGroup3 {
            position: absolute;
            right: 6px;
            top: 738px;
            width: 360px;
            height: 200px;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <canvas id="hud"></canvas>
    <canvas id="hudGroup2"></canvas>
    <canvas id="hudGroup3"></canvas>
    <div id="status"></div>
    <div id="fcsStatusLog"></div>
    <div id="mouseCoordTip">lon: —, lat: —</div>
    <script>
        // 配置由C++注入
        /*{{MAP_CONFIG}}*/
        /*{{STATUS_TEXT}}*/
    </script>
    <script>
        /*{{MAP_JS}}*/
    </script>
</body>
</html>
