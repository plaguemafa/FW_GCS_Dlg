<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0b0f14;
        }
        #map {
            position: relative;
            cursor: grab;
        }
        .tile {
            position: absolute;
            width: 256px;
            height: 256px;
            pointer-events: none;
        }
        #hud {
            position: absolute;
            right: 6px;/*right: 12px;*/
            top: 0.5%;              /*  在1920x1080分辨率下HUD顶端与窗口顶端留出0.0%像素 */
            width: 360px;
            height: 360px;
            pointer-events: none;
            z-index: 20;
            background: rgba(0,0,0,0.12);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
        }
        #status {
            position: absolute;
            left: 12px;
            top: 12px;
            color: #e0e0e0;
            font-family: Segoe UI, Arial;
            font-size: 12px;
            background: rgba(0,0,0,0.45);
            padding: 6px 8px;
            border-radius: 4px;
            z-index: 10;
            pointer-events: none;
        }
        /* 添加HUD组2和HUD组3的Canvas样式 - 修正：位于HUD下方，右对齐 */
        #hudGroup2 {
            position: absolute;
            right: 6px;
            top: 372px;
            width: 360px;
            height: 360px;
            pointer-events: none;
            z-index: 20;
        }
        #hudGroup3 {
            position: absolute;
            right: 6px;
            top: 738px;
            width: 360px;
            height: 200px;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <canvas id="hud"></canvas>
    <canvas id="hudGroup2"></canvas>
    <canvas id="hudGroup3"></canvas>
    <div id="status"></div>
    <script>
        // 配置由C++注入
        /*{{MAP_CONFIG}}*/
        /*{{STATUS_TEXT}}*/
    </script>
    <script>
        /*{{MAP_JS}}*/
    </script>
</body>
</html>
